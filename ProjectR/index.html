<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritushka VIP</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Шапка профиля -->
        <header class="profile-header glass-card">
            <div class="profile-info">
                <div class="avatar-wrapper">
                    <img id="user-avatar" src="https://via.placeholder.com/60" alt="Avatar">
                </div>
                <div>
                    <h2 id="username">Загрузка...</h2>
                    <div class="balance-badge">
                        <span class="coin-icon">💎</span>
                        <span id="user-balance">0</span> R$
                    </div>
                </div>
            </div>
        </header>

        <!-- Основной контент (Вкладки) -->
        <main class="content-area">
            
            <!-- Вкладка 1: Питомец (просмотр) -->
            <section id="tab-home" class="tab-content active">
                <div class="pet-section-header">
                    <span class="vip-tag">RITUSHKA VIP</span>
                    <h3>Твой питомец</h3>
                    <p class="subtitle">Так выглядит твой персонаж сейчас ✨</p>
                </div>

                <div class="pet-card glass-card">
                    <div class="pet-display" id="petDisplay">
                        <span class="pet-emoji">🐾</span>
                    </div>
                    <div class="equipped-list-preview" id="equippedPreview">
                        Ничего не надето
                    </div>
                </div>

                <button class="wardrobe-shortcut-btn" onclick="switchTab('wardrobe')">
                    <span class="btn-icon">👗</span>
                    <span>Перейти в гардероб</span>
                    <span class="arrow">→</span>
                </button>
            </section>

            <!-- Вкладка 2: Гардероб (примерка) -->
            <section id="tab-wardrobe" class="tab-content">
                <div class="section-heading">
                    <div>
                        <span class="vip-tag">ПРИМЕРОЧНАЯ</span>
                        <h3>Гардероб</h3>
                    </div>
                </div>

                <div class="category-tabs" id="categoryTabs">
                    <button class="category-tab active" data-category="all">Все</button>
                    <button class="category-tab" data-category="head">Кепки</button>
                    <button class="category-tab" data-category="glasses">Очки</button>
                    <button class="category-tab" data-category="accessory">Аксессуары</button>
                </div>

                <div class="items-grid" id="itemsGrid"></div>
            </section>

            <!-- Вкладка 3: Магазин -->
            <section id="tab-shop" class="tab-content">
                <h3>Магазин стилей</h3>
                <div id="shop-items" class="items-grid">
                    <div class="item-card">
                        <div class="item-art">🧥</div>
                        <div class="item-name">Стильная куртка</div>
                        <button class="action-btn" onclick="alert('Покупка в разработке!')">Купить (150 💎)</button>
                    </div>
                    <div class="item-card">
                        <div class="item-art">🕶️</div>
                        <div class="item-name">Крутые очки</div>
                        <button class="action-btn" onclick="alert('Покупка в разработке!')">Купить (75 💎)</button>
                    </div>
                </div>
            </section>

            <!-- Вкладка 4: Профиль -->
            <section id="tab-profile" class="tab-content">
                <h3>Информация</h3>
                <div class="glass-card info-card">
                    <p><strong>ID пользователя:</strong> <span id="profile-id">-</span></p>
                    <p><strong>Статус:</strong> <span class="status-active">Активен</span></p>
                </div>
            </section>
        </main>

        <!-- Нижняя навигация (4 кнопки) -->
        <nav class="bottom-nav glass-card">
            <button class="nav-item active" onclick="switchTab('home')">
                <span class="nav-icon">🐾</span>
                <span>Питомец</span>
            </button>
            <button class="nav-item" onclick="switchTab('wardrobe')">
                <span class="nav-icon">👗</span>
                <span>Гардероб</span>
            </button>
            <button class="nav-item" onclick="switchTab('shop')">
                <span class="nav-icon">🛍️</span>
                <span>Магазин</span>
            </button>
            <button class="nav-item" onclick="switchTab('profile')">
                <span class="nav-icon">👤</span>
                <span>Профиль</span>
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
