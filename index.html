<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гардероб Ритухи</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем Telegram Web App скрипт -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <!-- Блок с карточкой гардероба -->
        <div class="card">
            <div class="card-icon">
                <div class="dress-icon">👗</div>
            </div>
            <div class="card-content">
                <h2>Твой гардероб</h2>
                <p>✨ Привет! Скоро здесь появятся твои купленные вещи.</p>
            </div>
        </div>

        <!-- Кнопка закрытия -->
        <button class="close-btn" id="closeBtn">Закрыть</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
