<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App</title>
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Шапка профиля -->
        <header class="profile-header glass-card">
            <div class="profile-info">
                <div class="avatar-wrapper">
                    <img id="user-avatar" src="https://via.placeholder.com/60" alt="Avatar">
                </div>
                <div>
                    <h2 id="username">Загрузка...</h2>
                    <div class="balance-badge">
                        <span class="coin-icon">💎</span>
                        <span id="user-balance">0</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Основной контент (Вкладки) -->
        <main class="content-area">
            <!-- Вкладка: Магазин -->
            <section id="tab-shop" class="tab-content active">
                <h3>Магазин стилей</h3>
                <div id="shop-items" class="items-grid">
                    <!-- Сюда товары будут подгружаться через JS -->
                </div>
            </section>

            <!-- Вкладка: Гардероб -->
            <section id="tab-wardrobe" class="tab-content">
                <h3>Мой гардероб</h3>
                <div id="wardrobe-items" class="items-grid">
                    <!-- Сюда купленные вещи будут подгружаться через JS -->
                </div>
            </section>

            <!-- Вкладка: Профиль -->
            <section id="tab-profile" class="tab-content">
                <h3>Информация</h3>
                <div class="glass-card info-card">
                    <p><strong>ID пользователя:</strong> <span id="profile-id">-</span></p>
                    <p><strong>Статус:</strong> <span class="status-active">Активен</span></p>
                </div>
            </section>
        </main>

        <!-- Нижняя навигация -->
        <nav class="bottom-nav glass-card">
            <button class="nav-item active" onclick="switchTab('shop')">
                <span class="nav-icon">🛍️</span>
                <span>Магазин</span>
            </button>
            <button class="nav-item" onclick="switchTab('wardrobe')">
                <span class="nav-icon">👗</span>
                <span>Гардероб</span>
            </button>
            <button class="nav-item" onclick="switchTab('profile')">
                <span class="nav-icon">👤</span>
                <span>Профиль</span>
            </button>
        </nav>
    </div>

    <!-- Подключаем логику -->
    <script src="script.js"></script>
</body>
</html>
